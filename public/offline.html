<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fbe3e8" />
    <title>Saani’s Atelier · offline</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        font: 16px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif;
        color: #3a2230;
        background:
          radial-gradient(60% 42% at 14% 8%, #ffd9c7 0%, transparent 70%),
          radial-gradient(52% 42% at 90% 18%, #cdb4f0 0%, transparent 72%),
          radial-gradient(80% 55% at 46% 104%, #f4a6c0 0%, transparent 74%),
          #fbe3e8;
      }
      main {
        max-width: 420px;
        text-align: center;
        padding: 28px 22px;
        border-radius: 22px;
        background: rgba(255, 250, 246, 0.85);
        box-shadow: 0 20px 34px -20px rgba(107, 30, 58, 0.5);
      }
      img { width: 72px; height: 72px; border-radius: 18px; }
      h1 { margin: 12px 0 6px; font: italic 400 30px Georgia, serif; color: #6b1e3a; }
      p { margin: 0 0 16px; }
      button {
        min-height: 46px;
        padding: 0 22px;
        border: 0;
        border-radius: 999px;
        background: #b2305f;
        color: #fff;
        font: 600 15px system-ui, sans-serif;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You’re offline</h1>
      <p>This page isn’t saved on your phone yet. The pages you’ve already opened still work. Try again when you have signal.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
