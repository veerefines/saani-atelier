<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffdfa"/><stop offset="1" stop-color="#ffe9ef"/></linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8b9d0"/><stop offset="1" stop-color="#e46b97"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff0b8"/><stop offset=".45" stop-color="#e8b04e"/><stop offset="1" stop-color="#b9792a"/></linearGradient>
    <linearGradient id="heart" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ee6f9c"/><stop offset="1" stop-color="#b2305f"/></linearGradient>
    <linearGradient id="tape" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fbeaa0"/><stop offset="1" stop-color="#f5d56e"/></linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#6b1e3a" flood-opacity=".28"/></filter>
    <clipPath id="body"><rect x="40" y="52" width="176" height="164" rx="22"/></clipPath>
  </defs>
  <ellipse cx="128" cy="226" rx="70" ry="9" fill="#6b1e3a" opacity=".14"/>
  <g filter="url(#soft)">
    <rect x="40" y="52" width="176" height="164" rx="22" fill="url(#paper)" stroke="#e8b04e" stroke-width="2.5"/>
  </g>
  <g clip-path="url(#body)">
    <rect x="40" y="52" width="176" height="52" fill="url(#head)"/>
    <path d="M40 98 q22 10 44 0 t44 0 t44 0 t44 0 V106 H40Z" fill="#fff5f8" opacity=".9"/>
    <ellipse cx="86" cy="64" rx="60" ry="10" fill="#fff" opacity=".28"/>
  </g>
  <rect x="40" y="52" width="176" height="164" rx="22" fill="none" stroke="#e8b04e" stroke-width="2.5"/>
  <!-- binder rings -->
  <g>
    <rect x="80" y="38" width="14" height="34" rx="7" fill="url(#gold)" stroke="#b9792a" stroke-width="1.2"/>
    <rect x="83" y="42" width="3.5" height="22" rx="1.75" fill="#fff" opacity=".6"/>
    <rect x="162" y="38" width="14" height="34" rx="7" fill="url(#gold)" stroke="#b9792a" stroke-width="1.2"/>
    <rect x="165" y="42" width="3.5" height="22" rx="1.75" fill="#fff" opacity=".6"/>
  </g>
  <!-- month title scribble -->
  <path d="M96 86 q8-14 14-2 q4 8 10-6 q6-12 12 2 q6 12 12-4 q6-12 12 2" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity=".95"/>
  <!-- days -->
  <g>
    <g fill="#e6dcf7">
      <rect x="58" y="120" width="22" height="20" rx="6"/><rect x="86" y="120" width="22" height="20" rx="6"/><rect x="114" y="120" width="22" height="20" rx="6"/><rect x="142" y="120" width="22" height="20" rx="6"/><rect x="170" y="120" width="22" height="20" rx="6"/>
      <rect x="58" y="146" width="22" height="20" rx="6"/><rect x="86" y="146" width="22" height="20" rx="6"/><rect x="170" y="146" width="22" height="20" rx="6"/>
      <rect x="58" y="172" width="22" height="20" rx="6"/><rect x="86" y="172" width="22" height="20" rx="6"/><rect x="114" y="172" width="22" height="20" rx="6"/>
    </g>
    <g fill="#d6ecf0"><rect x="142" y="172" width="22" height="20" rx="6"/><rect x="170" y="172" width="22" height="20" rx="6"/></g>
    <rect x="114" y="146" width="22" height="20" rx="6" fill="#fde3a3"/>
    <rect x="142" y="146" width="22" height="20" rx="6" fill="#f9c4d6"/>
  </g>
  <!-- the special day: heart -->
  <path d="M153 150.5c-2.4-3.2-8-1.6-7 2.6 1 3.4 7 7 7 7s6-3.6 7-7c1-4.2-4.6-5.8-7-2.6z" fill="url(#heart)" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/>
  <!-- today: gold star -->
  <path d="M125 148.5l2.3 4.8 5.2.7-3.8 3.6 1 5.2-4.7-2.6-4.7 2.6 1-5.2-3.8-3.6 5.2-.7z" fill="url(#gold)" stroke="#b9792a" stroke-width=".8" stroke-linejoin="round"/>
  <!-- washi tape -->
  <g transform="rotate(-24 62 62)">
    <rect x="30" y="50" width="62" height="20" rx="3" fill="url(#tape)" opacity=".94" stroke="#e8c458" stroke-width=".8"/>
    <g stroke="#fff" stroke-width="2" opacity=".55"><path d="M42 50v20M54 50v20M66 50v20M78 50v20"/><path d="M30 60h62"/></g>
  </g>
  <!-- sparkles -->
  <path d="M214 74l3.2 8 8 3.2-8 3.2-3.2 8-3.2-8-8-3.2 8-3.2z" fill="url(#gold)"/>
  <path d="M34 168l2.2 5.4 5.4 2.2-5.4 2.2-2.2 5.4-2.2-5.4-5.4-2.2 5.4-2.2z" fill="url(#gold)" opacity=".9"/>
  <circle cx="226" cy="150" r="3" fill="#f4a6c0"/>
</svg>
